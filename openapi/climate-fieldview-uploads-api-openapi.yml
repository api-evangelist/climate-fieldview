openapi: 3.2.0
info:
  title: Climate FieldView Platform Uploads API
  description: '**Last Modified**: Mon Dec 8 16:27:39 UTC 2025


    All endpoints are only accessible via HTTPS. * All API endpoints are located at `https://platform.climate.com` (e.g. `https://platform.climate.com/v4/fields`). * The authorization token endpoint is located at

    `https://api.climate.com/api/oauth/token`. ## Troubleshooting


    `X-Http-Request-Id` response header will be returned on every call,

    successful or not. If you experience an issue with our api and need

    to contact technical support, please supply the value of the `X-Http-Request-Id`

    header along with an approximate time of when the request was made. ## Request Limits


    When you’re onboarded to Climate’s API platform, your `x-api-key` is assigned a custom usage plan. Usage plans are unique to each partner and have the following key attributes:


    1. Throttling information

    * burstLimit: Maximum rate limit over a period ranging from 1 second to a few seconds

    * rateLimit: A steady-state rate limit


    2. Quota information

    * Limit: The maximum number of requests that can be made in a given month


    When the request rate threshold is exceeded, a `429` response code is returned. Optionally, the `Retry-After` header may be returned:


    Following are examples of rate limit errors:


    1. Rate limit exceeded:


    HTTP/1.1 429


    Content-Type: application/json


    Content-Length: 32


    {"message":"Too Many Requests"}


    2. Quota exhausted:


    HTTP/1.1 429


    Content-Type: application/json


    Content-Length: 29


    {"message":"Limit Exceeded"}


    ## Pagination


    Pagination is performed via headers. Any request which returns a `"results"`

    array may be paginated. The following figure shows how query results are laid out with

    X-Limit=4 and no filter applied. * If there are no results, a response code of `304` will be returned. * If the response is the last set of results, a response code of `200` or

    `206` will be returned. * If there are more results, a response code of `206` will be returned. * If `X-Next-Token` is provided in the request headers but the token has

    expired, a response code of `409` will be returned. This is only applicable

    for some endpoints; see specific endpoint documentation below. #### X-Limit


    The page size can be controlled with the `X-Limit` header. Valid values are

    `1-100` and defaults to `100`. #### X-Next-Token


    If the results are paginated, a response header of `X-Next-Token` will be

    returned. Use the associated value in the subsequent request (via the `X-Next-Token`

    request header) to retrieve the next page. The following sequence diagram shows how to

    use `X-Next-Token` to fetch all the records. ## Chunked Uploads


    Uploads larger than `5MiB` (`5242880 bytes`) must be done in `5MiB` chunks

    (with the exception of the final chunk). Each chunk request MUST contain a

    `Content-Range` header specifying the portion of the upload, and a `Content-Type`

    header specifying binary content type (`application/octet-stream`). Range

    uploads must be contiguous. The maximum upload size is capped at `500MiB` (`524288000 bytes`). ## Chunked Downloads


    Downloads larger than `5MiB` (`5242880 bytes`) must be done in `1-5MiB`

    chunks (with the exception of the final chunk, which may be less than `1MiB`). Each chunk request MUST contain a `Range` header specifying the requested portion of the download,

    and an `Accept` header specifying binary and json content types (`application/octet-stream,application/json`)

    or all content types (`*/*`). ## Drivers


    If you need drivers to process agronomic data, download the ADAPT plugin below. We only support the plugin in the Windows environment, minimum is Windows 7 SP1. For asPlanted, asHarvested and asApplied data:

    * ADAPT Plugin


    Release notes can be found here. Download and use of the ADAPT plugin means that you agree to the EULA for use of the ADAPT plugin. Please review the EULA (last updated on June 6th, 2019) before download and use of the ADAPT plugin.'
  contact:
    name: Climate FieldView Support
    email: developer@climate.com
  version: 4.0.11
servers:
- url: https://platform.climate.com/
tags:
- name: Uploads
  description: General data upload endpoints.
paths:
  /v4/uploads:
    post:
      summary: Initiate a new upload
      description: 'Step one in uploading a data product. The method will return an **Upload** ID which the caller will use in subsequent `PUT` requests. The following `contentTypes` may be uploaded:

        __image/vnd.climate.thermal.geotiff__


        Allows for the upload of a thermal image. The image is a single band geotiff with 64 bit signed floating point values in degrees Celsius. The Coordinate Reference System (CRS) must be UTM with WGS84 datum. The following metadata entries are required to be embedded in the geotiff:

        * acquisitionStartDate - ISO8601 date

        * acquisitionEndDate - ISO8601 date

        * isCalibrated - boolean


        The following metadata entries are optional:

        * sourceId - uuid referencing the asset in the partner''s system

        * fieldId - uuid referencing a field in the Climate system

        * boundaryId - uuid referencing a boundary in the Climate system

        * brandId - uuid referencing a partner''s branding in the Climate system

        * name - name of the layer. The maximum number of characters that will be accepted as input is 20. Requires either imagery:write or platform scope. __image/vnd.climate.ndvi.geotiff__


        Allows for the upload of a NDVI image. The image is a single band geotiff with 64 bit signed floating point values in the range of -1 to 1 inclusive. The Coordinate Reference System (CRS) must be UTM with WGS84 datum. The following metadata entries are required to be embedded in the geotiff:

        * acquisitionStartDate - ISO8601 date

        * acquisitionEndDate - ISO8601 date


        The following metadata entries are optional:

        * sourceId - uuid referencing the asset in the partner''s system

        * fieldId - uuid referencing a field in the Climate system

        * boundaryId - uuid referencing a boundary in the Climate system

        * brandId - uuid referencing a partner''s branding in the Climate system

        * name - name of the layer. The maximum number of characters that will be accepted as input is 20. Requires either imagery:write or platform scope. __image/vnd.climate.rgb.geotiff__


        Allows for the upload of a true color image. The image is a multi band geotiff with 24-bit composite values. Each band is 8 bits with values in the range of 0 to 255. The Coordinate Reference System (CRS) must be UTM with WGS84 datum. The geotiff must contain 3 bands in the order Red, Green, Blue. The following metadata entries are required to be embedded in the geotiff:

        * acquisitionStartDate - ISO8601 date

        * acquisitionEndDate - ISO8601 date

        * isCalibrated - boolean


        The following metadata entries are optional:

        * sourceId - uuid referencing the asset in the partner''s system

        * fieldId - uuid referencing a field in the Climate system

        * boundaryId - uuid referencing a boundary in the Climate system

        * brandId - uuid referencing a partner''s branding in the Climate system

        * reflectanceComputeMethod - either TOA or GROUND

        * name - name of the layer. The maximum number of characters that will be accepted as input is 20. Requires either imagery:write or platform scope. __image/vnd.climate.rgb-nir.geotiff__


        Allows for the upload of a Near Infrared (NIR) image. The Coordinate Reference System (CRS) must be UTM with WGS84 datum. The following metadata entries are required to be embedded in the geotiff:

        * acquisitionStartDate - ISO8601 date

        * acquisitionEndDate - ISO8601 date

        * isCalibrated - boolean


        The following metadata entries are optional:

        * sourceId - uuid referencing the asset in the partner''s system

        * fieldId - uuid referencing a field in the Climate system

        * boundaryId - uuid referencing a boundary in the Climate system

        * brandId - uuid referencing a partner''s branding in the Climate system

        * reflectanceComputeMethod - either TOA or GROUND

        * name - name of the layer. The maximum number of characters that will be accepted as input is 20. Requires either imagery:write or platform scope. __image/vnd.climate.rgb-cir.geotiff__


        Allows for the upload of a Color Infrared (CIR) image. The Coordinate Reference System (CRS) must be UTM with WGS84 datum.'
      operationId: postUpload
      tags:
      - Uploads
      security:
      - api_key: []
      - oauth2_authorization_code:
        - platform
        - fields:write
        - imagery:write
        - rx:write
        - standCount:write
        - weedCount:write
        - asApplied:write
        - asPlanted:write
        - asHarvested:write
      parameters:
      - $ref: '#/components/parameters/X-Recipient-Email'
      responses:
        '201':
          $ref: '#/components/responses/PostUploadOk'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Upload'
  /v4/uploads/{uploadId}:
    put:
      summary: Chunked upload of data
      description: Send chunked data for an **Upload**.
      operationId: chunkedUpload
      tags:
      - Uploads
      security:
      - api_key: []
      - oauth2_authorization_code:
        - platform
        - fields:write
        - imagery:write
        - rx:write
        - soil:write
        - asApplied:write
        - asPlanted:write
        - asHarvested:write
      parameters:
      - $ref: '#/components/parameters/ContentRange'
      - $ref: '#/components/parameters/UploadId'
      - $ref: '#/components/parameters/BinaryContentType'
      responses:
        '204':
          $ref: '#/components/responses/204'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /v4/uploads/{uploadId}/status:
    get:
      summary: Retrieve Upload status
      description: Check the status of an **Upload** by ID.
      operationId: fetchUploadStatusById
      tags:
      - Uploads
      security:
      - api_key: []
      - oauth2_authorization_code:
        - platform
        - fields:write
        - imagery:write
        - rx:write
        - asApplied:write
        - asPlanted:write
        - asHarvested:write
      parameters:
      - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          $ref: '#/components/responses/FetchUploadStatusByIdOk'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
  /v4/uploads/status/query:
    post:
      summary: Retrieve Upload statuses in batch
      description: Check the status of multiple **Uploads** (up to 100 per request).
      operationId: fetchUploadStatuses
      tags:
      - Uploads
      security:
      - api_key: []
      - oauth2_authorization_code:
        - platform
        - fields:write
        - imagery:write
        - rx:write
        - asApplied:write
        - asPlanted:write
        - asHarvested:write
      responses:
        '200':
          $ref: '#/components/responses/FetchUploadStatusesOk'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
        '503':
          $ref: '#/components/responses/503'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadStatusQuery'
components:
  responses:
    '503':
      description: Server Busy
      headers:
        X-Http-Request-Id:
          description: Unique identifier assigned to the request.
          schema:
            type: string
        Retry-After:
          description: Number of seconds to wait before retrying the request.
          schema:
            type: integer
            format: int32
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '500':
      description: Internal Server Error
      headers:
        X-Http-Request-Id:
          description: Unique identifier assigned to the request.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '404':
      description: Not Found
      headers:
        X-Http-Request-Id:
          description: Unique identifier assigned to the request.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PostUploadOk:
      description: Returns a new upload with ID used to PUT file contents.
      headers:
        X-Http-Request-Id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreatedUpload'
    '403':
      description: Forbidden
      headers:
        X-Http-Request-Id:
          description: Unique identifier assigned to the request.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FetchUploadStatusByIdOk:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UploadStatus'
    '204':
      description: No Content
      headers:
        X-Http-Request-Id:
          description: Unique identifier assigned to the request.
          schema:
            type: string
    '401':
      description: Unauthorized
      headers:
        X-Http-Request-Id:
          description: Unique identifier assigned to the request.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '429':
      description: Too Many Requests
      headers:
        X-Http-Request-Id:
          description: Unique identifier assigned to the request.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '400':
      description: Bad Input
      headers:
        X-Http-Request-Id:
          description: Unique identifier assigned to the request.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    FetchUploadStatusesOk:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UploadStatuses'
  schemas:
    UploadStatus:
      type: object
      required:
      - id
      - status
      properties:
        id:
          description: Unique identifier for the upload.
          type: string
          format: uuid
        status:
          description: "Current status of the upload:\n  * `UPLOADING` - Uploading has started, parts are still coming in.\n  * `INVALID` - Upload has failed validity check.\n  * `PENDING` - Upload has been received by Climate and is being processed.\n  * `INBOX` - The upload is awaiting user acceptance in their Data Inbox.\n  * `DECLINED` - The user has declined the upload in their Data Inbox.\n  * `IMPORTING` - The user has accepted the upload and it is being imported into their account.\n  * `SUCCESS` - The upload has been successfully imported.\n"
          type: string
          enum:
          - UPLOADING
          - INVALID
          - PENDING
          - INBOX
          - DECLINED
          - IMPORTING
          - SUCCESS
    CreatedUpload:
      type: string
      format: uuid
      description: Successfully created upload request
    Upload:
      type: object
      description: Client request to upload data for a user.
      required:
      - contentType
      - md5
      - length
      properties:
        contentType:
          type: string
          enum:
          - image/vnd.climate.thermal.geotiff
          - image/vnd.climate.ndvi.geotiff
          - image/vnd.climate.rgb.geotiff
          - image/vnd.climate.rgb-nir.geotiff
          - image/vnd.climate.rgb-cir.geotiff
          - image/vnd.climate.waterstress.geotiff
          - image/vnd.climate.elevation.geotiff
          - image/vnd.climate.raw.geotiff
          - application/vnd.climate.field.geojson
          - application/vnd.climate.rx.planting.shp
          - application/vnd.climate.prescription.zones.shp
          - application/vnd.climate.modus.xml
          - application/vnd.climate.as-applied.zip
          - application/vnd.climate.as-planted.zip
          - application/vnd.climate.as-harvested.zip
          format: mime-type
          description: Content type representing data being uploaded (e.g. image/vnd.climate.rgb.geotiff)
        md5:
          type: string
          description: Base64 encoded md5 hash of the content
        length:
          type: integer
          format: int64
          description: Content size in bytes
        metadata:
          $ref: '#/components/schemas/Metadata'
    Error:
      type: object
      properties:
        error:
          type: object
          required:
          - id
          - code
          - message
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
            message:
              type: string
              description: Description of the error encountered.
    Metadata:
      type: object
      additionalProperties: true
    UploadStatuses:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/UploadStatus'
    UploadStatusQuery:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          items:
            description: Unique identifier for the upload.
            type: string
            format: uuid
  parameters:
    X-Recipient-Email:
      in: header
      name: X-Recipient-Email
      description: Email address associated with a Climate account, used when to sending to another user.
      required: false
      schema:
        type: string
    BinaryContentType:
      in: header
      name: Content-Type
      description: Must be `application/octet-stream`
      required: true
      schema:
        type: string
    ContentRange:
      in: header
      name: Content-Range
      description: Byte range `bytes start-end/total` (https://www.w3.org/Protocols/rfc2616/rfc2616-sec14.html#sec14.16). e.g. bytes 0-5242880/10242880. Downloads larger than 5MiB (5242880 bytes) in size must be downloaded in chunks no larger than 5MiB (5242880 bytes) and no smaller than 1MiB (1048576 bytes). The last chunk could be less than 1MiB (1048576 bytes).
      required: true
      schema:
        type: string
    UploadId:
      in: path
      description: Unique identifier of an Upload.
      name: uploadId
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    oauth2_authorization_code:
      description: 'Log in with FieldView OAuth2 provider (Authorization Code Grant). Used to authorize the client (partner) and

        user. The *access_token* is required to be provided in the `Authorization` header on all calls to the FieldView

        APIs with the following format `Bearer $access_token`.'
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://climate.com/static/app-login/
          tokenUrl: https://api.climate.com/api/oauth/token
          scopes:
            platform: (DEPRECATED) Legacy scope used for some Platform APIs
            fields:read: Required for retrieving field and boundary information
            farmOrganizations:read: Required for retrieving farm organization information
            operations:read: Required for retrieving operation information
            resourceOwners:read: Required for retrieving resource owner information
            scouting:read: Required for retrieving user\'s scouting information
            exports:read: Required for requesting or retrieving exports
            fields:write: Required for uploading field boundaries
            imagery:write: Required for uploading imagery
            rx:write: Required for uploading prescriptions
            soil:write: Required for uploading soil sample results
            asApplied:read: Required for retrieving as applied data
            asApplied:write: Required for uploading application data
            asPlanted:read: Required for retrieving planting data
            asPlanted:write: Required for uploading planting data
            asHarvested:read: Required for retrieving harvest data
            asHarvested:write: Required for uploading harvest data
            diagnostics:read: Required for retrieving CNH machine diagnostic data
            plantingActivitySummary:read: Required for retrieving planting activity summary data
            customerInsights:read: Required for retrieving customer insights metrics data
            avroAgronomicData:read: Required for retrieving agronomic data
    api_key:
      description: 'API access key used to control throttling (429 responses).  This key is typically formatted:

        `partner-{name}-{uuid}`'
      type: apiKey
      name: X-Api-Key
      in: header
x-amazon-apigateway-api-key-source: AUTHORIZER
x-provenance:
  method: harvested
  publisher: Climate FieldView
  source: https://dev.fieldview.com/openapi/platform.yaml
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
