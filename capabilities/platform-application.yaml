naftiko: 1.0.0-alpha2
info:
  label: Climate FieldView Platform API — Application
  description: 'Climate FieldView Platform API — Application. 1 operations. Lead operation: List as-applied agrochemical layers.
    Self-contained Naftiko capability covering one Climate Fieldview business surface.'
  tags:
  - Climate Fieldview
  - Application
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CLIMATE_FIELDVIEW_API_KEY: CLIMATE_FIELDVIEW_API_KEY
capability:
  consumes:
  - type: http
    namespace: platform-application
    baseUri: https://api.climate.com/api
    description: Climate FieldView Platform API — Application business capability. Self-contained, no shared references.
    resources:
    - name: v4-layers-asApplied
      path: /v4/layers/asApplied
      operations:
      - name: listasappliedlayers
        method: GET
        description: List as-applied agrochemical layers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fieldId
          in: query
          type: string
        - name: occurredAfter
          in: query
          type: string
        - name: limit
          in: query
          type: integer
    authentication:
      type: bearer
      token: '{{env.CLIMATE_FIELDVIEW_API_KEY}}'
  exposes:
  - type: rest
    namespace: platform-application-rest
    port: 8080
    description: REST adapter for Climate FieldView Platform API — Application. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/v4/layers/asapplied
      name: v4-layers-asapplied
      description: REST surface for v4-layers-asApplied.
      operations:
      - method: GET
        name: listasappliedlayers
        description: List as-applied agrochemical layers
        call: platform-application.listasappliedlayers
        with:
          fieldId: rest.fieldId
          occurredAfter: rest.occurredAfter
          limit: rest.limit
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: platform-application-mcp
    port: 9090
    transport: http
    description: MCP adapter for Climate FieldView Platform API — Application. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: list-applied-agrochemical-layers
      description: List as-applied agrochemical layers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-application.listasappliedlayers
      with:
        fieldId: tools.fieldId
        occurredAfter: tools.occurredAfter
        limit: tools.limit
      outputParameters:
      - type: object
        mapping: $.
