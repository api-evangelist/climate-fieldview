capabilities:
  - id: climate-fieldview.list-grower-fields
    name: List grower fields and boundaries
    description: >-
      Retrieve the set of fields a grower has shared with a FieldView
      partner application, including GeoJSON boundaries, names, and
      grower/farm metadata used to align ag-tech operations with
      cultivated land.
    apis:
      - climate-fieldview:fieldview-platform-api
  - id: climate-fieldview.access-planting-data
    name: Access as-planted activity data
    description: >-
      Read as-planted layers (seed variety, population, planting depth,
      planted area, geometry) generated from FieldView Drive and other
      monitor-equipped planters to drive analytics and recommendations.
    apis:
      - climate-fieldview:fieldview-platform-api
  - id: climate-fieldview.access-harvest-data
    name: Access as-harvested yield data
    description: >-
      Pull yield, moisture, and harvested-area data captured during
      harvest passes, supporting yield analytics, benchmarking, and
      profitability mapping at field and zone level.
    apis:
      - climate-fieldview:fieldview-platform-api
  - id: climate-fieldview.access-application-records
    name: Access as-applied chemical and fertilizer records
    description: >-
      Retrieve as-applied activity records covering crop-protection and
      nutrient applications, including product, rate, and coverage
      polygons for compliance, sustainability reporting, and decision
      support.
    apis:
      - climate-fieldview:fieldview-platform-api
  - id: climate-fieldview.access-soil-samples
    name: Access soil sample results
    description: >-
      Read structured soil-sample observations (lab results, sample
      points, depth, nutrient values) tied to FieldView fields to
      power variable-rate prescriptions and agronomic recommendations.
    apis:
      - climate-fieldview:fieldview-platform-api
